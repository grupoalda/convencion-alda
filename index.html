.brand h1{font-family:var(--display);font-weight:900;font-size:1.5rem;letter-spacing:-.02em;line-height:1;margin:0 0 4px}
.brand p{margin:0;color:var(--muted);font-size:.875rem;line-height:1.35}
.days-left{font-family:var(--display);font-weight:900;font-size:clamp(3.25rem,15vw,5.5rem);line-height:.95;letter-spacing:-.03em;margin:0}

/* Selector de grupo */

/* Ahora */
.clock-sub{color:var(--muted);margin:10px 0 28px;font-size:.9375rem}
.now-card{background:var(--now);color:var(--now-ink);border-radius:20px;padding:22px 22px 20px;margin-bottom:14px}
.now-card .when{font-size:.875rem;font-weight:600;opacity:.8}
.now-card h2{font-family:var(--display);font-weight:900;font-size:1.875rem;line-height:1.05;letter-spacing:-.02em;margin:6px 0 8px}
.now-card p{margin:0;opacity:.9}
.bar{height:6px;border-radius:6px;background:color-mix(in srgb,var(--now-ink) 22%,transparent);margin-top:18px;overflow:hidden}
.bar i{display:block;height:100%;background:currentColor;border-radius:6px}
.left{margin-top:8px;font-size:.8125rem;opacity:.8}
.next{border:1px solid var(--rule);border-radius:16px;padding:16px 18px;background:var(--surface);margin-bottom:10px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:baseline}
.next .t{font-family:var(--display);font-weight:900;font-size:1.375rem;line-height:1;letter-spacing:-.01em}
.next h3{margin:0;font-size:1rem;font-weight:600;line-height:1.3}
.next .meta{grid-column:2;color:var(--muted);font-size:.875rem}
.section-h{font-weight:700;font-size:.9375rem;margin:28px 0 10px}
.count{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 28px}
.count div{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:12px 8px;text-align:center}
.count b{display:block;font-family:var(--display);font-weight:900;font-size:2.5rem;line-height:1}
.count span{color:var(--muted);font-size:.8125rem}

/* Agenda */
.days{display:flex;gap:8px;margin-bottom:20px}
.days button{flex:1;text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:14px;padding:10px 14px;cursor:pointer}
.days button b{display:block;font-family:var(--display);font-weight:900;font-size:1.25rem;line-height:1.05}
.days button span{color:var(--muted);font-size:.8125rem}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.days button[aria-pressed="true"] span{color:inherit;opacity:.85}
.tl{list-style:none;margin:0;padding:0}
.ev{display:grid;grid-template-columns:4.5rem 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--rule)}
.ev:first-child{border-top:0}
.ev .t{font-family:var(--display);font-weight:900;font-size:1.25rem;line-height:1;letter-spacing:-.01em}
.ev .t small{display:block;font-family:var(--body);font-weight:500;font-size:.75rem;color:var(--muted);margin-top:4px}
.ev h3{margin:0 0 4px;font-size:1.0625rem;line-height:1.3;font-weight:600}
.ev .meta{color:var(--muted);font-size:.875rem}
.ev ul{margin:8px 0 0;padding-left:18px;font-size:.9375rem}
.ev .tag{display:inline-block;font-size:.75rem;font-weight:600;border-radius:999px;padding:2px 9px;margin-top:8px;border:1px solid var(--moss);color:var(--moss)}
.ev.past{opacity:.45}
.ev.live{background:var(--now);color:var(--now-ink);border-radius:16px;padding:16px 14px;margin:6px -14px;border-top:0}
.ev.live + .ev{border-top:0}
.ev.live .meta,.ev.live .t small{color:inherit;opacity:.8}
.ev.live .tag{border-color:currentColor;color:inherit}
.bus h3::before{content:"🚌 "}

/* Info */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:18px;padding:18px 20px;margin-bottom:14px}
.card h2{font-family:var(--display);font-weight:900;font-size:1.375rem;letter-spacing:-.01em;line-height:1;margin:0 0 12px}
.card p{margin:0 0 8px}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:7.5rem 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--rule);font-size:.9375rem}
.rows li:first-child{border-top:0}
.rows b{font-weight:600}

/* Simulador */
details.sim{margin-top:36px;color:var(--muted);font-size:.875rem}
details.sim summary{cursor:pointer}
details.sim input{width:100%;margin-top:12px;accent-color:var(--accent)}
details.sim button{margin-top:8px;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer}

/* Navegación inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs div{max-width:640px;margin:0 auto;display:flex}
nav.tabs a{flex:1;text-align:center;padding:12px 0 14px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.9375rem}
nav.tabs a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--accent)}
[hidden]{display:none!important}
@media (prefers-reduced-motion: no-preference){ .now-card{animation:in .5s ease-out} @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<main>
  <header class="brand">
    <div class="logo" role="img" aria-label="Alda Hotels"></div>
    <div><h1>Convención 2026</h1><p>Alda Villa de Almazán (Soria)<br>17 y 18 de noviembre</p></div>
  </header>

  <section id="v-ahora"></section>
  <section id="v-agenda" hidden></section>
  <section id="v-info" hidden></section>
</main>

<nav class="tabs" aria-label="Secciones">
  <div>
    <a href="#ahora" data-v="ahora">Ahora</a>
    <a href="#agenda" data-v="agenda">Agenda</a>
    <a href="#info" data-v="info">Info</a>
  </div>
</nav>

<script>
const TZ = "Europe/Madrid";
const D = (day, hm) => new Date(`2026-11-${day}T${hm}:00+01:00`);

// Agenda (fuente: pestaña «Agenda» del Excel de la convención)
const EVENTS = [
  // Martes 17
  {d:17, s:D(17,"12:00"), e:D(17,"14:00"), t:"Recepción de autoridades y presentación de Alda Villa de Almazán", p:"Cafetería", tag:"Autoridades e invitados"},
  {d:17, s:D(17,"13:30"), e:D(17,"14:00"), t:"Autobús de Soria a Almazán", p:"Salida desde los hoteles de Soria", bus:true},
  {d:17, s:D(17,"14:00"), e:D(17,"16:00"), t:"Comida", p:"Sala comedor"},
  {d:17, s:D(17,"16:00"), e:D(17,"18:00"), t:"Arranque de la convención", p:"Salón San Juan", items:["Presentación de la agenda de los dos días","Reparto de camisetas","Mural en equipo y mascota de la convención","…y alguna sorpresa"]},
  {d:17, s:D(17,"18:00"), e:D(17,"18:30"), t:"Coffee break", p:"Sala comedor"},
  {d:17, s:D(17,"18:30"), e:D(17,"20:00"), t:"Juego de preguntas y actividad física", p:"Salón San Juan"},
  {d:17, s:D(17,"20:00"), e:D(17,"21:00"), t:"Carlos Barrio", p:"Discoteca"},
  {d:17, s:D(17,"21:30"), e:D(18,"00:00"), t:"Cena temática con música tradicional", p:"Salón San Juan"},
  {d:17, s:D(17,"23:30"), e:D(17,"23:45"), t:"Autobús de Almazán a Soria", p:"Regreso a los hoteles de Soria", bus:true, point:true},
  // Miércoles 18
  {d:18, s:D(18,"08:00"), e:D(18,"09:30"), t:"Desayuno", p:""},
  {d:18, s:D(18,"09:30"), e:D(18,"10:00"), t:"Autobús de Soria a Almazán", p:"Salida desde los hoteles de Soria", bus:true},
  {d:18, s:D(18,"10:30"), e:D(18,"14:30"), t:"Pruebas por equipos", p:"Pabellón"},
  {d:18, s:D(18,"14:30"), e:D(18,"16:00"), t:"Comida picnic", p:"Pabellón"},
  {d:18, s:D(18,"16:30"), e:D(18,"19:00"), t:"Tarde de ocio", p:"Almazán", items:["Visita al pueblo y al Ayuntamiento. Punto de encuentro: puerta de la villa, en la oficina de turismo","Búsqueda de setas con la Asociación Micológica. Recogida en la arboleda junto al pabellón"]},
  {d:18, s:D(18,"16:30"), e:D(18,"18:00"), t:"Reunión de departamentos", p:"Salón San Juan"},
  {d:18, s:D(18,"18:00"), e:D(18,"18:15"), t:"Coffee break", p:"Sala comedor"},
  {d:18, s:D(18,"18:15"), e:D(18,"19:00"), t:"Reunión de departamentos (segunda parte)", p:"Salón San Juan"},
  {d:18, s:D(18,"19:00"), e:D(18,"21:00"), t:"Descanso y cambio de ropa", p:"Vuelve a Almazán ya cambiado para las 21:00"},
  {d:18, s:D(18,"21:00"), e:D(18,"21:30"), t:"Discurso de Alberto Boo", p:""},
  {d:18, s:D(18,"21:30"), e:D(18,"23:00"), t:"Cena y entrega de premios", p:"Sala comedor y cafetería · Presenta Ignacio Filgueiras"},
  {d:18, s:D(18,"23:00"), e:D(19,"01:00"), t:"Concierto de la Banda Poprumbera y DJ", p:"Dos horas de banda y después pincha Martín"},
  {d:18, s:D(19,"01:00"), e:D(19,"01:15"), t:"Autobús de regreso (primer turno)", p:"Almazán → hoteles de Soria", bus:true, point:true},
  {d:18, s:D(19,"03:00"), e:D(19,"03:15"), t:"Autobús de regreso (último turno)", p:"Almazán → hoteles de Soria", bus:true, point:true},
];
const DAYS = {17:{name:"Martes 17", short:"Martes"}, 18:{name:"Miércoles 18", short:"Miércoles"}};

const fmt = d => new Intl.DateTimeFormat("es-ES",{hour:"2-digit",minute:"2-digit",timeZone:TZ}).format(d);
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mins = ms => Math.max(0,Math.round(ms/60000));
const human = m => m < 60 ? `${m} min` : `${Math.floor(m/60)} h${m%60?` ${m%60} min`:""}`;

let simTime = null, view = "ahora", agendaDay = null;

const now = () => simTime ? new Date(simTime) : new Date();
const visible = () => EVENTS;
const where = e => e.p ? `<div class="meta">${esc(e.p)}</div>` : "";
const timeLabel = e => e.point ? fmt(e.s) : `${fmt(e.s)}–${fmt(e.e)}`;

function renderAhora(){
  const n = now(), list = visible();
  const live = list.filter(e => e.s<=n && n<e.e && !e.point);
  const upcoming = list.filter(e => e.s>n).slice(0,3);
  let h = "";
  const first = list[0].s, last = list[list.length-1].e;

  if (n < first){
    const dd = Math.ceil((first - n)/864e5);
    h += `<p class="days-left">${dd===1?"Mañana":`${dd} días`}</p><p class="clock-sub">${dd===1?"empieza la convención":"para la convención"}</p>`;
  } else if (n >= last){
    h += `<p class="clock-sub">La convención ha terminado.</p>
      <div class="now-card"><h2>Gracias por venir</h2><p>Nos vemos en la próxima.</p></div>`;
  } else {
    const dayName = DAYS[(live[0]||upcoming[0]||list[list.length-1]).d].name;
    h += `<p class="clock-sub">${dayName} de noviembre</p>`;
    if (live.length){
      live.forEach(e=>{
        const pct = Math.min(100,((n-e.s)/(e.e-e.s))*100);
        h += `<div class="now-card"><div class="when">Ahora · ${timeLabel(e)}</div><h2>${esc(e.t)}</h2>${e.p?`<p>${esc(e.p)}</p>`:""}
          <div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div><div class="left">Quedan ${human(mins(e.e-n))}</div></div>`;
      });
    } else {
      h += `<div class="now-card"><div class="when">Ahora</div><h2>Tiempo libre</h2><p>${upcoming[0]?`Lo siguiente empieza en ${human(mins(upcoming[0].s-n))}.`:""}</p></div>`;
    }
  }
  if (upcoming.length){
    h += `<h2 class="section-h">Lo siguiente</h2>`;
    upcoming.forEach(e=>{
      const sameDay = new Intl.DateTimeFormat("es-ES",{day:"numeric",timeZone:TZ}).format(e.s) === new Intl.DateTimeFormat("es-ES",{day:"numeric",timeZone:TZ}).format(n);
      const lead = n>=first ? `En ${human(mins(e.s-n))}` : DAYS[e.d].name;
      h += `<div class="next ${e.bus?"bus":""}"><span class="t">${fmt(e.s)}</span><h3>${e.bus?"🚌 ":""}${esc(e.t)}</h3><div class="meta">${lead}${e.p?` · ${esc(e.p)}`:""}</div></div>`;
    });
  }
  h += `<details class="sim" ${simTime?"open":""}><summary>Ver la app en otro momento de la convención</summary>
    <input type="range" id="simR" min="${D(17,"11:30").getTime()}" max="${D(19,"03:30").getTime()}" step="${15*6e4}" value="${simTime||D(17,"16:30").getTime()}" aria-label="Momento simulado">
    <div id="simL">${simTime?`Simulando: ${DAYS[new Date(simTime).getTime()<D(18,"05:00").getTime()?17:18].short} ${fmt(new Date(simTime))}`:"Mueve el control para ver qué aparecería"}</div>
    ${simTime?`<button id="simX">Volver a la hora real</button>`:""}</details>`;
  document.getElementById("v-ahora").innerHTML = h;
  const r = document.getElementById("simR");
  r.addEventListener("input", ()=>{ simTime = +r.value; renderAll(); });
  const x = document.getElementById("simX"); if (x) x.onclick = ()=>{ simTime=null; renderAll(); };
}

function renderAgenda(){
  const n = now();
  if (!agendaDay) agendaDay = n >= D(18,"05:00") ? 18 : 17;
  let h = `<div class="days" role="group" aria-label="Día">` + Object.entries(DAYS).map(([k,v])=>
    `<button data-d="${k}" aria-pressed="${+k===agendaDay}"><b>${v.short}</b><span>${k} de noviembre</span></button>`).join("") + `</div><ol class="tl">`;
  visible().filter(e=>e.d===agendaDay).forEach(e=>{
    const cls = ["ev", e.bus?"bus":"", (e.e<=n)?"past":"", (e.s<=n&&n<e.e&&!e.point)?"live":""].join(" ");
    h += `<li class="${cls}"><div class="t">${fmt(e.s)}${e.point?"":`<small>hasta ${fmt(e.e)}</small>`}</div><div>
      <h3>${esc(e.t)}</h3>${where(e)}
      ${e.items?`<ul>${e.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`:""}
      ${e.tag?`<span class="tag">${esc(e.tag)}</span>`:""}</div></li>`;
  });
  h += `</ol>`;
  const el = document.getElementById("v-agenda"); el.innerHTML = h;
  el.querySelectorAll(".days button").forEach(b=>b.onclick=()=>{agendaDay=+b.dataset.d;renderAgenda();});
}

function renderInfo(){
  const buses = EVENTS.filter(e=>e.bus);
  document.getElementById("v-info").innerHTML = `
    <div class="card"><h2>Autobuses</h2><ul class="rows">
      ${buses.map(e=>`<li><b>${DAYS[e.d].short} ${fmt(e.s)}</b><span>${esc(e.t.replace(/^Autobús /,"").replace(/^de /,"De "))}</span></li>`).join("")}
    </ul></div>
    <div class="card"><h2>Dónde es cada cosa</h2><p>Todo es en Alda Villa de Almazán.</p><ul class="rows">
      <li><b>Salón San Juan</b><span>Arranque, juegos, cena del martes y reuniones de departamento</span></li>
      <li><b>Sala comedor</b><span>Comida del martes, coffee breaks y cena de premios</span></li>
      <li><b>Pabellón</b><span>Pruebas por equipos y picnic del miércoles</span></li>
      <li><b>Discoteca</b><span>Carlos Barrio, martes a las 20:00</span></li>
      <li><b>Cafetería</b><span>Recepción de autoridades y cena de premios</span></li>
    </ul></div>
    <div class="card"><h2>Ten en cuenta</h2>
      <p>El miércoles entre las 19:00 y las 21:00 hay tiempo para descansar y cambiarse. A las 21:00 hay que estar de vuelta en Almazán.</p>
      <p>El miércoles por la tarde hay dos planes de ocio: visita al pueblo o búsqueda de setas.</p>
    </div>`;
}

function renderAll(){
  renderAhora(); renderAgenda(); renderInfo();
}

function route(){
  const v = (location.hash||"#ahora").slice(1);
  view = ["ahora","agenda","info"].includes(v) ? v : "ahora";
  ["ahora","agenda","info"].forEach(k=>document.getElementById("v-"+k).hidden = k!==view);
  document.querySelectorAll("nav.tabs a").forEach(a=>{ if(a.dataset.v===view) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  window.scrollTo(0,0);
}

window.addEventListener("hashchange", route);
renderAll(); route();
setInterval(()=>{ if(!simTime) { renderAhora(); if(view==="agenda") renderAgenda(); } }, 30000);
</script>
</body>
</html>
